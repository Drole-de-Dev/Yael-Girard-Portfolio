<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/Yael-Girard-Portfolio/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/crystal.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Quicksand:wght@500;700&display=swap">
  <link rel="stylesheet" href="style/style.css">
  <script src="js/theme.js"></script>
  <script src="js/rain.js" defer></script>
  <script src="js/thunder.js" defer></script>
</head>
<body>

  <canvas id="rain" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="index.html">
        <img src="images/crystal.svg" alt="" width="30" height="30">
        Yaël Girard
      </a>
      <div class="bar-right">
        <nav aria-label="Main">
          <a href="index.html#about">About</a>
          <a href="index.html#projects">Projects</a>
          <a href="index.html#contact">Contact</a>
        </nav>
        <button type="button" class="pill" id="theme-toggle" hidden>Switch to day</button>
      </div>
    </div>
  </header>

  <main class="wrap lost">
    <p class="code">404</p>
    <h1>Lost in the rain</h1>
    <p class="lead">This page doesn't exist, or it moved. Let's get you back inside</p>
    <div class="links">
      <a class="btn btn-main" href="index.html">Back to the home page</a>
      <a class="btn" href="index.html#projects">See my projects</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="tea" aria-hidden="true">
      <span class="steam"></span>
      <span class="steam"></span>
      <span class="steam"></span>
      <span class="steam"></span>      
      <svg width="100" height="44" viewBox="0 0 100 44">
        <ellipse class="saucer" cx="45" cy="38" rx="38" ry="5"/>
        <path class="handle" d="M70 14 C86 12 86 30 68 30"/>
        <path class="cup" d="M16 8 H74 V18 C74 30 62 38 45 38 C28 38 16 30 16 18 Z"/>
        <ellipse class="cup" cx="45" cy="8" rx="29" ry="5.5"/>
        <ellipse class="tea-surface" cx="45" cy="9" rx="26" ry="4"/>
      </svg>
    </div>
    <p>Take your time, the tea is still hot.</p>

    <div class="atmosphere">
      <div class="seg" id="rain-levels" role="group" aria-label="Rain intensity" hidden>
        <span>Rain</span>
        <button type="button" data-level="calm" aria-pressed="false">Calm</button>
        <button type="button" data-level="steady" aria-pressed="true">Steady</button>
        <button type="button" data-level="storm" aria-pressed="false">Storm</button>
      </div>
      <button type="button" class="pill" id="thunder-toggle" aria-pressed="true" hidden>Thunder</button>
    </div>

    <p>&copy; 2026 Yaël Girard. Made with HTML, CSS and a bit of rain.</p>
  </footer>

</body>
</html>
